name: simple_permissions_web
description: "Web implementation for simple_permissions_native."
version: 1.3.4
homepage: https://github.com/simplezen/simple-permissions
repository: https://github.com/simplezen/simple-permissions
issue_tracker: https://github.com/simplezen/simple-permissions/issues

topics:
  - permissions
  - web
  - privacy

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.7'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  simple_permissions_platform_interface: ^1.3.4
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  plugin:
    implements: simple_permissions_native
    platforms:
      web:
        pluginClass: SimplePermissionsWeb
        fileName: simple_permissions_web.dart
