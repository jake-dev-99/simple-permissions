include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Keep Flutter build output and platform scaffolding out of Dart analysis.
    # Explicit exclusions prevent SDK migration from changing publishable source (UNFY-123).
    - build/**
  errors:
    unawaited_futures: error
    unused_import: error
    unused_local_variable: error
    dead_code: error
    invalid_null_aware_operator: error

linter:
  rules:
    - prefer_null_aware_operators
    - cancel_subscriptions
    - close_sinks
    - test_types_in_equals
    - throw_in_finally
    - unnecessary_await_in_return
