name: Publish to pub.dev

# Triggered by tag pushes on `main` matching one of the federated
# packages' tag prefixes. Each package has its own tag pattern so a
# tagged release publishes exactly one package — consistent with
# pub.dev's automated-publishing contract (one tag pattern per
# package registration).
#
# Tags are created by `release.yml` (workflow_dispatch). There is no
# auto-tag step; tags only exist when a human deliberately cuts one.
# This eliminates the orphan-tag drift class that plagued the
# previous auto-tag.yml flow.
#
# Each `publish-*` job uses the canonical
# `dart-lang/setup-dart/.github/workflows/publish.yml@v1` reusable
# workflow, which handles OIDC token exchange with pub.dev. Per-job
# `if:` gating ensures only the matching package publishes for a
# given tag.

on:
  push:
    tags:
      - 'simple_permissions_native-v*'
      - 'simple_permissions_platform_interface-v*'
      - 'simple_permissions_android-v*'
      - 'simple_permissions_ios-v*'
      - 'simple_permissions_macos-v*'
      - 'simple_permissions_web-v*'

jobs:
  publish-native:
    if: startsWith(github.ref, 'refs/tags/simple_permissions_native-v')
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: .

  publish-platform-interface:
    if: startsWith(github.ref, 'refs/tags/simple_permissions_platform_interface-v')
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/simple_permissions_platform_interface

  publish-android:
    if: startsWith(github.ref, 'refs/tags/simple_permissions_android-v')
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/simple_permissions_android

  publish-ios:
    if: startsWith(github.ref, 'refs/tags/simple_permissions_ios-v')
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/simple_permissions_ios

  publish-macos:
    if: startsWith(github.ref, 'refs/tags/simple_permissions_macos-v')
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/simple_permissions_macos

  publish-web:
    if: startsWith(github.ref, 'refs/tags/simple_permissions_web-v')
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/simple_permissions_web
