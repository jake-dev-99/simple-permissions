name: Verify

# Verifies a change before it lands on main: runs on every PR
# targeting main and on every direct push to main (which only
# happens via the "Cut Release" workflow's bot bypass — covered
# for safety so any tag-firing commit has been gated).
# Single-branch model: feature branches PR directly into main,
# releases are cut via the "Cut Release" workflow which tags +
# triggers the "Deploy" workflow.
#
# Ubuntu-only by design. GitHub bills macOS runners at ~10x the
# Linux rate, and a native smoke suite on every PR burns through
# the free-tier minutes fast. The sibling plugin repos run this
# same minimal matrix and catch the regressions that matter
# (analyzer + unit tests). Apple-surface validation lives
# downstream in consumer-app smoke tests and manual device runs.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Manual override for re-running the gate against a specific ref
  # (e.g. after a flaky external dep stabilizes).
  workflow_dispatch:

jobs:
  release-tooling:
    name: Batch release recovery tests
    runs-on: ubuntu-latest
    env:
      RELEASE_SDK_SMOKE: 'true'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
      - name: Validate workflow syntax
        run: |
          set -euo pipefail
          curl -fLsS https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/release.yml .github/workflows/deploy.yml .github/workflows/verify.yml
      - run: python3 -m pip install -r tool/release-requirements.txt
      - run: python3 -m unittest discover -s tool -p 'test_*.py' -v

  package-tests:
    name: Package Unit Tests (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - "."
          - packages/simple_permissions_platform_interface
          - packages/simple_permissions_android
          - packages/simple_permissions_ios
          - packages/simple_permissions_macos
          - packages/simple_permissions_web

    steps:
      # External actions pinned to full commit SHA per security policy.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable

      - name: Install dependencies
        working-directory: ${{ matrix.package }}
        run: flutter pub get

      - name: Analyze package
        working-directory: ${{ matrix.package }}
        # invalid_dependency warning on path-overrides between federated
        # platform packages is expected during pre-publish development;
        # drop warning fatality so it doesn't block the gate.
        run: flutter analyze --no-fatal-warnings

      - name: Run package tests
        working-directory: ${{ matrix.package }}
        # Several platform packages are native-surface-only with no
        # Dart tests. Tolerate missing test/ rather than fail.
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "No test/ directory — skipping."
          fi

      # Validate publishability at CI time so publish-blocking issues
      # (missing LICENSE, malformed pubspec, oversize files, missing
      # repository/issue_tracker URLs) surface before merge instead of
      # after a tag push.
      #
      # `--dry-run` exits 0 on hints (the `pubspec_overrides.yaml`
      # warning expected during pre-publish dev) but fails on hard
      # errors. 2-minute cap to fail fast if pub is wedged.
      - name: Validate publishability (pub publish --dry-run)
        timeout-minutes: 2
        working-directory: ${{ matrix.package }}
        run: flutter pub publish --dry-run
