name: Auto-tag on merge

# Runs when a PR merges to `main`. Figures out which federated
# packages changed, computes a next version per package, commits
# the pubspec bump back to main, and pushes a tag — which
# triggers publish.yml.
#
# ## Versioning rule
#
# Per package, on each merge:
#
#   pubspec_version  = what the pubspec.yaml currently says
#   last_published   = pub.dev's latest published version
#                      (falls back to git tags only when pub.dev
#                      returns 404 — i.e. the package has never
#                      been published)
#   candidate        = last_published with patch + 1
#                      (or pubspec_version itself when neither
#                      pub.dev nor tags know about this package
#                      yet — i.e. first publish; whatever the
#                      pubspec says is what ships).
#   next_version     = max(pubspec_version, candidate)
#
# Why pub.dev and not git tags? A tag can exist without ever
# reaching pub.dev (publish.yml run that timed out, OIDC
# misconfiguration, etc.). When that happens, basing `candidate`
# on the orphan tag silently bumps git further past pub.dev,
# producing the "non-incremental update" hint pub.dev emits when
# you finally publish — and burying the source of truth (what
# users have actually installed). pub.dev's API is the only
# authoritative answer to "what's the latest version a user can
# `flutter pub get`."
#
# Behaviour that falls out:
#   - Developer did nothing special -> patch bump from pub.dev's
#     latest.
#   - Developer bumped pubspec (minor or major) on the merge PR
#     -> next_version == pubspec_version (the auto-bumper sees
#     pubspec > candidate and respects the manual intent).
#   - First release of a package -> pubspec_version wins because
#     pub.dev returns 404 and no tags exist; whatever the pubspec
#     says is what ships.
#   - Orphan git tag from a previously-failed publish -> ignored.
#     Next attempt re-uses the same version because pub.dev never
#     received it; the orphan can be deleted later without
#     affecting this workflow.
#
# ## Change detection
#
# A package "changed" if any file under its working dir changed
# between the push's before and after SHAs. Matches the
# working-dir column in docs/RELEASE.md's tag-pattern table.
#
# ## Why a workflow and not a bot
#
# Stays inside the `.github/workflows` review surface — any
# branch protection or required-review rule catches a
# misbehaving auto-tagger the same way it catches bad code.
# Bots can be quieter / scarier.

on:
  push:
    branches: [main]

jobs:
  autotag:
    # Skip the commit this workflow itself creates (contains
    # `[skip ci]` in the message) to prevent an infinite loop.
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    permissions:
      # `contents: write` — commit pubspec bump + push tags.
      # `actions:  write` — dispatch publish.yml via
      #   `gh workflow run` after tags land. Required because
      #   GitHub suppresses `push: tags` workflow triggers when
      #   the pusher is the default GITHUB_TOKEN, so we wake
      #   publish.yml through `workflow_dispatch` instead.
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so `git log` / `git tag --list` see
          # everything we need.
          fetch-depth: 0
          # Authenticate as the repo's auto-tag deploy key, NOT the
          # default GITHUB_TOKEN. Rationale: `main` has a ruleset
          # requiring PRs + signed commits for every push. The bot
          # identity that backs GITHUB_TOKEN (`github-actions[bot]`)
          # is not a bypass-able actor on GitHub's ruleset picker, so
          # its pushes get rejected with GH013. A deploy key *is* in
          # the bypass list, so pushes authenticated via SSH with
          # this key skip both rules.
          #
          # Setup (see docs/RELEASE.md "CI secrets & rulesets"):
          #   1. Repo Settings → Deploy keys: public key with write
          #      access.
          #   2. Repo Settings → Secrets → Actions: private key stored
          #      as AUTO_TAG_DEPLOY_KEY.
          #   3. Repo Settings → Rules → main ruleset → Bypass list:
          #      "Deploy keys" present.
          #
          # `ssh-key` makes checkout load the key into ssh-agent and
          # clone via SSH; subsequent `git push` inherits that auth
          # automatically. The workflow_dispatch call further down
          # stays on GITHUB_TOKEN (it's an API call, not a push —
          # doesn't touch `main` and doesn't need the bypass).
          ssh-key: ${{ secrets.AUTO_TAG_DEPLOY_KEY }}

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Compute + apply version bumps
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA:  ${{ github.event.after }}
        run: |
          set -euo pipefail

          # Mapping: package_name -> working_dir. Keep in sync
          # with publish.yml's matrix.
          declare -A pkgs=(
            [simple_permissions_native]="."
            [simple_permissions_platform_interface]="packages/simple_permissions_platform_interface"
            [simple_permissions_android]="packages/simple_permissions_android"
            [simple_permissions_ios]="packages/simple_permissions_ios"
            [simple_permissions_macos]="packages/simple_permissions_macos"
            [simple_permissions_web]="packages/simple_permissions_web"
          )

          touched_any=false
          pending_tags=()

          # First-push safety: github.event.before on the very
          # first push to a fresh branch is all-zeros. Fall back
          # to empty-tree comparison so every tracked file
          # counts as changed.
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BEFORE_SHA="$(git hash-object -t tree /dev/null)"
          fi

          changed_files="$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")"

          next_patch() {
            # Bump the patch of X.Y.Z -> X.Y.(Z+1). Strips any
            # pre-release suffix (0.3.0-dev.1 -> 0.3.0) before
            # incrementing, which matches "promote the latest
            # stable tag" semantics.
            local v="$1"
            local base="${v%%-*}"
            IFS='.' read -r major minor patch <<< "$base"
            echo "${major}.${minor}.$((patch + 1))"
          }

          version_gt() {
            # Returns 0 (true) iff $1 > $2 per semver-ish sort.
            # Strips pre-release suffix; pure X.Y.Z compare.
            local a="${1%%-*}" b="${2%%-*}"
            [ "$(printf '%s\n%s\n' "$a" "$b" | sort -V | tail -1)" = "$a" ] \
              && [ "$a" != "$b" ]
          }

          # Resolve "what's actually published" for one package.
          # Hits pub.dev's public API (no auth required for reads).
          #
          # Distinguishes three outcomes via exit code so the caller
          # can react differently — collapsing them all into "fall back
          # to git tags" would re-introduce the orphan-tag drift this
          # patch is meant to prevent (a transient pub.dev 5xx during
          # auto-tag would silently use the local orphan tag, push a
          # newer version, and the orphan would become permanent).
          #
          #   exit 0  + version on stdout → ok, use it.
          #   exit 10 → pub.dev 404 (package not published yet). Caller
          #             may fall back to git tags (first-publish path).
          #   exit 20 → transient: 5xx, network/TLS, timeout, or 200
          #             with a body that jq can't parse. Caller MUST
          #             fail loudly rather than silently fall back.
          pubdev_latest() {
            local pkg="$1"
            local response http body version
            # `-w '\n%{http_code}'` appends the HTTP code on its own
            # line so we can split body / status reliably. `--max-time
            # 10` so a flaky network call doesn't hang the workflow.
            # `-S` is preserved without `2>/dev/null` so curl's own
            # error messages (DNS failure, TLS handshake, timeout, …)
            # surface in the workflow log instead of being swallowed —
            # exit 20 then has a paper trail the operator can act on.
            response="$(curl -sS --max-time 10 \
              -w $'\n%{http_code}' \
              "https://pub.dev/api/packages/${pkg}")" \
              || return 20
            http="${response##*$'\n'}"
            body="${response%$'\n'*}"
            case "$http" in
              200)
                version="$(echo "$body" \
                  | jq -r '.latest.version // empty' 2>/dev/null)" \
                  || {
                    printf '::warning::pubdev_latest(%s): jq could not parse 200 response body: %s\n' \
                      "$pkg" "$(printf '%s' "$body" | head -c 200 | tr '\n' ' ')" >&2
                    return 20
                  }
                if [ -z "$version" ]; then
                  printf '::warning::pubdev_latest(%s): 200 OK but .latest.version is empty: %s\n' \
                    "$pkg" "$(printf '%s' "$body" | head -c 200 | tr '\n' ' ')" >&2
                  return 20
                fi
                echo "$version"
                return 0
                ;;
              404) return 10 ;;
              *)
                printf '::warning::pubdev_latest(%s): HTTP %s — body: %s\n' \
                  "$pkg" "$http" "$(printf '%s' "$body" | head -c 200 | tr '\n' ' ')" >&2
                return 20
                ;;
            esac
          }

          for pkg in "${!pkgs[@]}"; do
            dir="${pkgs[$pkg]}"
            rel_prefix="${dir%/}"
            if [ "$rel_prefix" = "." ]; then
              # Root package: "changed" iff a file under the root
              # pubspec/lib/etc changed, but NOT if the change is
              # only inside packages/ (which belongs to another
              # sub-package).
              if ! echo "$changed_files" | grep -Ev '^packages/' | grep -q .; then
                continue
              fi
            else
              if ! echo "$changed_files" | grep -q "^${rel_prefix}/"; then
                continue
              fi
            fi

            pubspec_path="${dir%/}/pubspec.yaml"
            [ "$dir" = "." ] && pubspec_path="pubspec.yaml"

            pubspec_v="$(grep '^version:' "$pubspec_path" \
              | sed 's/version:[[:space:]]*//' | tr -d '\r')"

            # Authoritative: pub.dev. Fall back to git tags ONLY on a
            # clean 404 (first-publish path). On transient errors (5xx,
            # network, parse), fail the whole workflow — silently using
            # local tags would silently drift git past pub.dev, which
            # is exactly what this patch prevents.
            set +e
            last_published="$(pubdev_latest "$pkg")"
            pd_status=$?
            set -e
            case "$pd_status" in
              0)
                source="pub.dev"
                ;;
              10)
                last_published="$(git tag --list "${pkg}-v*" \
                  | sed "s/^${pkg}-v//" \
                  | sort -V | tail -1 || true)"
                if [ -n "$last_published" ]; then
                  source="git-tag-fallback (pub.dev 404)"
                else
                  source="unpublished (pub.dev 404, no git tags)"
                fi
                ;;
              *)
                echo "::error::pubdev_latest($pkg) failed with code $pd_status — transient pub.dev or network error. Re-run the workflow once pub.dev is healthy. Aborting to avoid silently drifting git tags past published versions."
                exit 1
                ;;
            esac

            if [ -z "$last_published" ]; then
              candidate="$pubspec_v"
            else
              candidate="$(next_patch "$last_published")"
            fi

            if version_gt "$pubspec_v" "$candidate"; then
              next="$pubspec_v"
            else
              next="$candidate"
            fi

            echo "::notice::$pkg pubspec=$pubspec_v last_published=${last_published:-<none>} (source=$source) next=$next"

            if [ "$pubspec_v" != "$next" ]; then
              sed -i -E "s/^version:[[:space:]]*.*$/version: $next/" "$pubspec_path"
              git add "$pubspec_path"
              touched_any=true
            fi

            pending_tags+=("${pkg}-v${next}")
          done

          if [ "$touched_any" = "true" ]; then
            git commit -m "chore(release): auto-bump pubspec versions [skip ci]"
          fi

          # Track only newly-created tags so the dispatch step
          # below doesn't try to re-publish an already-shipped
          # version (pub.dev would reject it, and the noise in
          # the Actions UI is misleading).
          new_tags=()
          for tag in "${pending_tags[@]}"; do
            # If this exact tag already exists (re-run, race),
            # leave it alone — the original push already did the
            # publish.
            if git rev-parse "$tag" >/dev/null 2>&1; then
              echo "::notice::tag $tag already exists — skipping"
              continue
            fi
            git tag "$tag"
            echo "tagged $tag"
            new_tags+=("$tag")
          done

          if [ "$touched_any" = "true" ] || [ "${#new_tags[@]}" -gt 0 ]; then
            # Push commit + tags atomically.
            git push --atomic origin HEAD "${new_tags[@]}"
          fi

          # Expose newly-pushed tags to the dispatch step below.
          printf 'new_tags=%s\n' "${new_tags[*]}" >> "$GITHUB_ENV"

      - name: Dispatch publish workflow per new tag
        if: ${{ env.new_tags != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # `--ref "$tag"` runs publish.yml as if triggered by the
          # tag push, so the OIDC token's `ref` claim is
          # `refs/tags/<tag>`. pub.dev's automated-publishing
          # policy validates that against the configured tag
          # pattern — without it the claim is `refs/heads/main`
          # and OIDC is silently rejected, falling back to
          # interactive OAuth that no one is there to answer.
          for tag in $new_tags; do
            echo "Dispatching publish.yml for $tag (ref=$tag)"
            gh workflow run publish.yml --ref "$tag" -f tag="$tag"
          done
