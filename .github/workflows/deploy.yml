name: Deploy

# Deploys a tagged release of a federated package to pub.dev. Each
# package has its own tag prefix so a single tagged release
# publishes exactly one package — consistent with pub.dev's
# automated-publishing contract (one tag pattern per package
# registration).
#
# Tags are created by the "Cut Release" workflow (workflow_dispatch).
# There is no auto-tag step; tags only exist when a human
# deliberately cuts one. This eliminates the orphan-tag drift class
# that plagued the previous auto-tag flow.
#
# Per-package matrix using subosito/flutter-action + flutter pub
# publish --force --skip-validation. This is the proven recipe that
# successfully published simple_permissions_ios 1.3.0.
# `--skip-validation` lets pub publish work for Flutter packages
# (skips resolution which trips on `sdk: flutter`); pub.dev's server
# still enforces version monotonicity, ownership, and OIDC binding.

on:
  push:
    tags:
      - 'simple_permissions_native-v*'
      - 'simple_permissions_platform_interface-v*'
      - 'simple_permissions_android-v*'
      - 'simple_permissions_ios-v*'
      - 'simple_permissions_macos-v*'
      - 'simple_permissions_web-v*'
  # Manual re-fire for an existing tag — e.g. transient pub.dev
  # outage swallowed the original tag-push run, or an OIDC config
  # was fixed and the publish needs to be retried against the same
  # tag. The `tag` input must be an existing tag name (e.g.
  # `simple_permissions_ios-v1.3.1`); the resolve step keys deploys
  # off that exact value.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re-)deploy (e.g. simple_permissions_ios-v1.3.1)'
        required: true
        type: string

jobs:
  # Resolve the effective tag name regardless of trigger:
  #   push:tags         → github.ref_name (e.g. simple_permissions_ios-v1.3.1)
  #   workflow_dispatch → inputs.tag
  # All downstream `if:` matrix gates and the checkout `ref:` key off
  # this single resolved value, so the rest of the workflow doesn't
  # have to branch on event type.
  resolve-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - name: Resolve tag
        id: resolve
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_GITHUB_REF_NAME: ${{ github.ref_name }}
          INPUT_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$INPUT_EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="$INPUT_GITHUB_REF_NAME"
          fi
          # Sanity: tag must match one of this repo's package prefixes.
          # Mistyped or wrong-repo tag input fails fast here.
          if ! [[ "$tag" =~ ^simple_permissions_(native|platform_interface|android|ios|macos|web)-v ]]; then
            echo "::error::Tag '$tag' does not match any expected simple_permissions_* package prefix."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ref=refs/tags/$tag" >> "$GITHUB_OUTPUT"
          echo "::notice::Resolved deploy tag: $tag"

  publish:
    needs: resolve-tag
    permissions:
      # `id-token: write` for pub.dev OIDC. `contents: read` so
      # actions/checkout can fetch the tagged ref (job-level
      # permissions override the workflow default; the read needs
      # to be re-declared explicitly).
      id-token: write
      contents: read
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        package:
          - name: simple_permissions_native
            path: "."
          - name: simple_permissions_platform_interface
            path: packages/simple_permissions_platform_interface
          - name: simple_permissions_android
            path: packages/simple_permissions_android
          - name: simple_permissions_ios
            path: packages/simple_permissions_ios
          - name: simple_permissions_macos
            path: packages/simple_permissions_macos
          - name: simple_permissions_web
            path: packages/simple_permissions_web

    # Per-step `if:` rather than job-level: GitHub Actions evaluates
    # job-level `if:` before matrix expansion, so `matrix.package.name`
    # isn't resolvable there.
    steps:
      # External actions pinned to full commit SHA per security policy.
      # `id-token: write` here means a compromised action could request
      # OIDC tokens for pub.dev; pinning prevents upstream-tag retargets
      # from silently swapping in malicious code mid-release.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        if: startsWith(needs.resolve-tag.outputs.tag, format('{0}-v', matrix.package.name))
        with:
          # Always check out the resolved tag (works for both push:tags
          # and workflow_dispatch event types).
          ref: ${{ needs.resolve-tag.outputs.ref }}
          # Full history for the ancestry check below.
          fetch-depth: 0

      - name: Verify tag commit is on main
        # `on.push.tags` is not branch-scoped — a tag pushed from any
        # branch (manually or via mistake) would otherwise trigger this
        # publish. release.yml normally only tags from main, but verify
        # independently rather than relying on that contract.
        if: startsWith(needs.resolve-tag.outputs.tag, format('{0}-v', matrix.package.name))
        env:
          RESOLVED_TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: |
          git fetch origin main
          # After checkout above, HEAD points at the tag's commit.
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Tag $RESOLVED_TAG does not point to a commit on origin/main. Aborting publish."
            exit 1
          fi

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        if: startsWith(needs.resolve-tag.outputs.tag, format('{0}-v', matrix.package.name))
        with:
          channel: stable

      - name: Verify pubspec version matches tag
        if: startsWith(needs.resolve-tag.outputs.tag, format('{0}-v', matrix.package.name))
        working-directory: ${{ matrix.package.path }}
        env:
          RESOLVED_TAG: ${{ needs.resolve-tag.outputs.tag }}
          PACKAGE_NAME: ${{ matrix.package.name }}
        run: |
          expected="${RESOLVED_TAG#${PACKAGE_NAME}-v}"
          actual="$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//')"
          if [ "$expected" != "$actual" ]; then
            echo "::error::Tag ${RESOLVED_TAG} does not match pubspec version ${actual} (expected ${expected})"
            exit 1
          fi

      - name: Install dependencies
        if: startsWith(needs.resolve-tag.outputs.tag, format('{0}-v', matrix.package.name))
        working-directory: ${{ matrix.package.path }}
        run: flutter pub get

      - name: Publish
        # 2-minute cap. A healthy OIDC-backed publish finishes in
        # 10-30 s; anything much longer means pub fell back to the
        # interactive OAuth flow (which happens if the OIDC token's
        # `ref` claim doesn't match pub.dev's configured tag
        # pattern). Better to fail fast than sit on the runner.
        timeout-minutes: 2
        if: startsWith(needs.resolve-tag.outputs.tag, format('{0}-v', matrix.package.name))
        working-directory: ${{ matrix.package.path }}
        run: flutter pub publish --force --skip-validation
