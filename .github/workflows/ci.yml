name: CI

# Runs on every PR targeting `main`. Single-branch model: feature
# branches PR directly into main, releases are cut via release.yml
# (manual workflow_dispatch) which tags + triggers publish.yml.
#
# Ubuntu-only by design. GitHub bills macOS runners at ~10x the
# Linux rate, and a native smoke suite on every PR burns through
# the free-tier minutes fast. The sibling plugin repos run this
# same minimal matrix and catch the regressions that matter
# (analyzer + unit tests). Apple-surface validation lives
# downstream in consumer-app smoke tests and manual device runs.
on:
  pull_request:
    branches: [main]

jobs:
  package-tests:
    name: Package Unit Tests (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - "."
          - packages/simple_permissions_platform_interface
          - packages/simple_permissions_android
          - packages/simple_permissions_ios
          - packages/simple_permissions_macos
          - packages/simple_permissions_web

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: ${{ matrix.package }}
        run: flutter pub get

      - name: Analyze package
        working-directory: ${{ matrix.package }}
        # invalid_dependency warning on path-overrides between federated
        # platform packages is expected during pre-publish development;
        # drop warning fatality so it doesn't block the gate.
        run: flutter analyze --no-fatal-warnings

      - name: Run package tests
        working-directory: ${{ matrix.package }}
        # Several platform packages are native-surface-only with no
        # Dart tests. Tolerate missing test/ rather than fail.
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "No test/ directory — skipping."
          fi

      # Validate publishability at CI time so publish-blocking issues
      # (missing LICENSE, malformed pubspec, oversize files, missing
      # repository/issue_tracker URLs) surface before merge instead of
      # after a tag push.
      #
      # `--dry-run` exits 0 on hints (the `pubspec_overrides.yaml`
      # warning expected during pre-publish dev) but fails on hard
      # errors. 2-minute cap to fail fast if pub is wedged.
      - name: Validate publishability (pub publish --dry-run)
        timeout-minutes: 2
        working-directory: ${{ matrix.package }}
        run: flutter pub publish --dry-run
