name: CI

# Runs on every PR against the three promotion-flow branches
# (develop -> staging -> main). Deliberately not on `push` —
# CD handles the merge side, CI only validates proposed change.
#
# Ubuntu-only by design. GitHub bills macOS runners at ~10x the
# Linux rate, and a native smoke suite on every PR burns through
# the free-tier minutes fast. The sibling plugin repos
# (simple-sms, simple-telephony, simple-query) run this same
# minimal matrix and catch the regressions that matter
# (analyzer + unit tests). Apple-surface validation lives
# downstream in consumer-app smoke tests and manual device runs.
on:
  pull_request:
    branches: [develop, staging, main]

jobs:
  package-tests:
    name: Package Unit Tests (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - "."
          - packages/simple_permissions_platform_interface
          - packages/simple_permissions_android
          - packages/simple_permissions_ios
          - packages/simple_permissions_macos
          - packages/simple_permissions_web

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: ${{ matrix.package }}
        run: flutter pub get

      - name: Analyze package
        working-directory: ${{ matrix.package }}
        run: flutter analyze

      - name: Run package tests
        working-directory: ${{ matrix.package }}
        run: flutter test

      # Validate publishability at CI time so publish-blocking issues
      # (missing LICENSE, malformed pubspec, oversize files, missing
      # repository/issue_tracker URLs) surface before merge instead of
      # after a tag push. CD then publishes with --skip-validation so
      # the same checks aren't re-run on the publish runner where
      # `pubspec_overrides.yaml` hints would otherwise clutter the log
      # and an interactive OAuth flow could stall the job.
      #
      # `--dry-run` exits 0 even when pub emits hints (e.g. the
      # in-flight `pubspec_overrides.yaml` warning) so it doesn't
      # falsely fail develop branches where overrides are expected.
      - name: Validate publishability (pub publish --dry-run)
        working-directory: ${{ matrix.package }}
        run: flutter pub publish --dry-run
